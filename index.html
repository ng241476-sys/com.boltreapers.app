
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOLT REAPERS ESP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{background:#151515;border-bottom:2px solid #e32323;padding:22px 15px;text-align:center}
header h1{color:#ff3030;margin:0;font-size:27px;letter-spacing:2px}
header p{color:#bbb;margin:8px 0 0;font-size:12px}
main{max-width:700px;margin:auto;padding:16px}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:18px;margin-top:0;color:#ff3939}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:7px;font-size:15px}
input,select{background:#090909;color:white;border:1px solid #444}
button{border:0;background:#e32323;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#333}
.delete{background:#721b1b}
.small{font-size:12px;color:#bbb}
.tournament{border:1px solid #383838;padding:13px;border-radius:9px;margin-top:12px}
.tournament h3{margin:0 0 10px;color:#fff}
.tag{color:#ff5555;font-weight:bold}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.hidden{display:none}
#message{white-space:pre-wrap;font-size:13px;color:#ff7777}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>⚡ BOLT REAPERS</h1>
  <p>FREE FIRE ESPORTS & TOURNAMENTS</p>
</header>

<main>
  <section class="card">
    <h2>🏆 Upcoming Tournaments</h2>
    <p class="small">সর্বশেষ টুর্নামেন্টের তথ্য এখানে দেখা যাবে।</p>
    <div id="tournaments">টুর্নামেন্ট লোড হচ্ছে...</div>
  </section>

  <section class="card" id="loginCard">
    <h2>🔐 Admin Login</h2>
    <p class="small">শুধু অনুমোদিত Admin অ্যাকাউন্ট দিয়ে লগইন করুন।</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>
    <div id="message"></div>
  </section>

  <section class="card hidden" id="adminPanel">
    <h2>⚙️ Admin Panel</h2>
    <p id="adminStatus" class="small">Admin হিসেবে লগইন করা আছে।</p>

    <form id="tournamentForm">
      <input id="tournamentName" placeholder="Tournament Name" required>
      <input id="tournamentDate" type="date" required>
      <input id="tournamentTime" placeholder="Time (e.g. 8:00 PM)" required>
      <input id="entryFee" placeholder="Entry Fee (e.g. FREE)" required>
      <input id="prizePool" placeholder="Prize Pool (e.g. ৳1000)" required>
      <select id="mode">
        <option value="Squad">Squad</option>
        <option value="Duo">Duo</option>
        <option value="Solo">Solo</option>
      </select>
      <select id="status">
        <option value="Upcoming">Upcoming</option>
        <option value="Live">Live</option>
        <option value="Completed">Completed</option>
      </select>
      <button id="saveButton" type="submit">ADD TOURNAMENT</button>
      <button id="cancelEdit" class="secondary hidden" type="button">CANCEL EDIT</button>
    </form>

    <button id="logoutButton" class="secondary" type="button">LOGOUT</button>
    <div id="adminMessage" class="small"></div>
  </section>
</main>

<footer>BOLT REAPERS ESP • Official Tournament Portal</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCX1za7vT5hF5O5LL69CHRT64noMOL80sg",
  authDomain: "bolt-reaper-f8667.firebaseapp.com",
  projectId: "bolt-reaper-f8667",
  storageBucket: "bolt-reaper-f8667.firebasestorage.app",
  messagingSenderId: "412297753956",
  appId: "1:412297753956:web:ccc9a34d797483c7e7f671"
};

const ADMIN_UID = "vrhvSL0XqfVtHFCvPzbyRzmtPkl2";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const tournamentCollection = db.collection("tournament");

const $ = id => document.getElementById(id);
let editingId = null;
let stopTournamentListener = null;

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function showMessage(text) {
  $("message").textContent = text;
}

function resetForm() {
  editingId = null;
  $("tournamentForm").reset();
  $("saveButton").textContent = "ADD TOURNAMENT";
  $("cancelEdit").classList.add("hidden");
}

function renderTournaments(snapshot) {
  const container = $("tournaments");

  if (snapshot.empty) {
    container.textContent = "এখনো কোনো টুর্নামেন্ট নেই।";
    return;
  }

  container.innerHTML = snapshot.docs.map(doc => {
    const t = doc.data();
    const adminButtons = auth.currentUser &&
      auth.currentUser.uid === ADMIN_UID
      ? `<div class="actions">
          <button type="button" data-edit="${safe(doc.id)}" class="secondary">EDIT</button>
          <button type="button" data-delete="${safe(doc.id)}" class="delete">DELETE</button>
        </div>`
      : "";

    return `<article class="tournament">
      <h3>${safe(t.name || "Tournament")}</h3>
      <p>📅 তারিখ: ${safe(t.date || "TBA")}</p>
      <p>⏰ সময়: ${safe(t.time || "TBA")}</p>
      <p>🎮 Mode: ${safe(t.mode || "Squad")}</p>
      <p>🎟 Entry Fee: ${safe(t.entryFee || "TBA")}</p>
      <p>🏆 Prize Pool: ${safe(t.prizePool || "TBA")}</p>
      <p>Status: <span class="tag">${safe(t.status || "Upcoming")}</span></p>
      ${adminButtons}
    </article>`;
  }).join("");
}

function watchTournaments() {
  if (stopTournamentListener) stopTournamentListener();

  stopTournamentListener = tournamentCollection.onSnapshot(
    renderTournaments,
    error => {
      $("tournaments").textContent =
        "টুর্নামেন্ট লোড হয়নি। Firebase Firestore Rules পরীক্ষা করুন।";
      console.error(error);
    }
  );
}

function setAdminUI(user) {
  const isAdmin = !!user && user.uid === ADMIN_UID;

  $("adminPanel").classList.toggle("hidden", !isAdmin);
  $("loginCard").classList.toggle("hidden", isAdmin);

  if (user && !isAdmin) {
    showMessage("এই অ্যাকাউন্টটি Admin নয়। অনুমোদিত Admin অ্যাকাউন্ট ব্যবহার করুন।");
  } else {
    showMessage("");
  }

  watchTournaments();
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  showMessage("লগইন হচ্ছে...");

  try {
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
  } catch (error) {
    showMessage("লগইন হয়নি: " + error.message);
  }
});

auth.onAuthStateChanged(user => {
  setAdminUI(user);
});

$("logoutButton").addEventListener("click", async () => {
  try {
    resetForm();
    await auth.signOut();
  } catch (error) {
    $("adminMessage").textContent = error.message;
  }
});

$("tournamentForm").addEventListener("submit", async event => {
  event.preventDefault();

  const user = auth.currentUser;
  if (!user || user.uid !== ADMIN_UID) {
    $("adminMessage").textContent = "Admin অনুমতি নেই।";
    return;
  }

  const data = {
    name: $("tournamentName").value.trim(),
    date: $("tournamentDate").value,
    time: $("tournamentTime").value.trim(),
    entryFee: $("entryFee").value.trim(),
    prizePool: $("prizePool").value.trim(),
    mode: $("mode").value,
    status: $("status").value
  };

  $("saveButton").disabled = true;
  $("adminMessage").textContent = "সংরক্ষণ হচ্ছে...";

  try {
    if (editingId) {
      await tournamentCollection.doc(editingId).update(data);
      $("adminMessage").textContent = "টুর্নামেন্ট আপডেট হয়েছে।";
    } else {
      await tournamentCollection.add(data);
      $("adminMessage").textContent = "নতুন টুর্নামেন্ট যোগ হয়েছে।";
    }
    resetForm();
  } catch (error) {
    $("adminMessage").textContent =
      "সংরক্ষণ হয়নি। Firebase Rules ও Admin UID পরীক্ষা করুন।";
    console.error(error);
  } finally {
    $("saveButton").disabled = false;
  }
});

$("cancelEdit").addEventListener("click", resetForm);

$("tournaments").addEventListener("click", async event => {
  const user = auth.currentUser;
  if (!user || user.uid !== ADMIN_UID) return;

  const editId = event.target.dataset.edit;
  const deleteId = event.target.dataset.delete;

  if (editId) {
    try {
      const doc = await tournamentCollection.doc(editId).get();
      if (!doc.exists) return;

      const t = doc.data();
      editingId = editId;
      $("tournamentName").value = t.name || "";
      $("tournamentDate").value = t.date || "";
      $("tournamentTime").value = t.time || "";
      $("entryFee").value = t.entryFee || "";
      $("prizePool").value = t.prizePool || "";
      $("mode").value = t.mode || "Squad";
      $("status").value = t.status || "Upcoming";
      $("saveButton").textContent = "SAVE CHANGES";
      $("cancelEdit").classList.remove("hidden");
      $("adminPanel").scrollIntoView({behavior:"smooth"});
    } catch (error) {
      $("adminMessage").textContent = "তথ্য লোড হয়নি।";
    }
  }

  if (deleteId) {
    if (!confirm("এই টুর্নামেন্টটি ডিলিট করতে চান?")) return;

    try {
      await tournamentCollection.doc(deleteId).delete();
      $("adminMessage").textContent = "টুর্নামেন্ট ডিলিট হয়েছে।";
    } catch (error) {
      $("adminMessage").textContent = "ডিলিট হয়নি। Firebase Rules পরীক্ষা করুন।";
    }
  }
});

watchTournaments();
</script>
</body>
</html>
